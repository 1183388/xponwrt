name: Build PonWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "Before cleanup:"
          df -h

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache

          echo
          echo "After cleanup:"
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            swig \
            time \
            libelf-dev

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Select only HG5585F CT
        run: |
          set -e

          cp configs/an7581.config .config

          echo "Original AN7581 device selections:"
          grep -E '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y$' .config || true

          echo
          echo "Disabling all AN7581 device selections..."

          while IFS= read -r line; do
            symbol="${line%%=*}"

            if [ -n "$symbol" ]; then
              sed -i "s/^${symbol}=y$/${symbol}=n/" .config
            fi
          done < <(
            grep -E '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y$' .config || true
          )

          echo
          echo "Enabling FiberHome HG5585F CT..."

          sed -i \
            's/^# CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5585f-ct is not set$/CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5585f-ct=y/' \
            .config

          sed -i \
            's/^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5585f-ct=n$/CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5585f-ct=y/' \
            .config

          echo
          echo "AN7581 device selections after modification:"
          grep -E '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=' .config || true

      - name: Configure
        run: |
          set -e

          make defconfig

          echo
          echo "Target:"
          grep '^CONFIG_TARGET_airoha' .config || true

          echo
          echo "AN7581 device selections after defconfig:"
          grep -E '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y$' .config || true

          DEVICE_COUNT="$(
            grep -E '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y$' .config \
            | wc -l
          )"

          echo
          echo "Enabled AN7581 device count: $DEVICE_COUNT"

          if [ "$DEVICE_COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly one enabled AN7581 device."
            exit 1
          fi

          if ! grep -q \
            '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5585f-ct=y$' \
            .config; then
            echo "ERROR: HG5585F CT is not the selected device."
            exit 1
          fi

          echo
          echo "Verified: only FiberHome HG5585F CT is enabled."

      - name: Download sources
        run: |
          make download -j$(nproc)

      - name: Build firmware
        run: |
          echo "CPU threads: $(nproc)"
          make -j$(nproc) V=s

      - name: Check HG5585F CT firmware
        run: |
          set -e

          IMAGE_DIR="bin/targets/airoha/an7581"

          echo "Looking for HG5585F CT sysupgrade image..."

          IMAGE="$(
            find "$IMAGE_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*fiberhome_hg5585f-ct-squashfs-sysupgrade.itb' \
              | head -n 1
          )"

          if [ -z "$IMAGE" ]; then
            echo "ERROR: HG5585F CT sysupgrade image was not found."
            exit 1
          fi

          echo
          echo "Found image:"
          echo "$IMAGE"

          echo
          ls -lh "$IMAGE"

          echo
          echo "File type:"
          file "$IMAGE"

          echo
          echo "SHA256:"
          sha256sum "$IMAGE"

      - name: Prepare final artifact
        run: |
          set -e

          mkdir -p artifact

          IMAGE="$(
            find bin/targets/airoha/an7581 \
              -maxdepth 1 \
              -type f \
              -name '*fiberhome_hg5585f-ct-squashfs-sysupgrade.itb' \
              | head -n 1
          )"

          cp "$IMAGE" artifact/

          cd artifact
          sha256sum *.itb > SHA256SUMS

          echo
          echo "Final artifact:"
          ls -lh

          echo
          echo "SHA256SUMS:"
          cat SHA256SUMS

      - name: Upload HG5585F CT sysupgrade firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-hg5585f-ct-sysupgrade
          path: artifact/**
          if-no-files-found: error
          retention-days: 30

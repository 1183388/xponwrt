name: Build PonWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "Before cleanup:"
          df -h

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache

          echo
          echo "After cleanup:"
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            swig \
            time \
            libelf-dev

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load AN7581 configuration
        run: |
          cp configs/an7581.config .config

          echo "Force selecting FiberHome HG5585F CT..."

          sed -i \
            's/^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5585f-cu=y$/# CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5585f-cu is not set/' \
            .config

          sed -i \
            's/^# CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5585f-ct is not set$/CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5585f-ct=y/' \
            .config

          echo
          echo "HG5585F configuration before defconfig:"
          grep -E 'CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5585f-(ct|cu)' .config || true

      - name: Configure
        run: |
          make defconfig

          echo
          echo "Selected target:"
          grep '^CONFIG_TARGET_airoha' .config || true

          echo
          echo "Selected HG5585F device:"
          grep -E 'CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5585f-(ct|cu)' .config || true

      - name: Download sources
        run: |
          make download -j$(nproc)

      - name: Build firmware
        run: |
          echo "CPU threads: $(nproc)"
          make -j$(nproc) V=s

      - name: Check HG5585F CT sysupgrade image
        run: |
          set -e

          IMAGE="bin/targets/airoha/an7581/ponwrt-airoha-an7581-fiberhome_hg5585f-ct-squashfs-sysupgrade.itb"

          echo "Checking image:"
          echo "$IMAGE"

          test -f "$IMAGE"

          echo
          echo "Image information:"
          ls -lh "$IMAGE"
          file "$IMAGE"

          echo
          echo "SHA256:"
          sha256sum "$IMAGE"

      - name: Prepare final artifact
        run: |
          set -e

          mkdir -p artifact

          IMAGE="bin/targets/airoha/an7581/ponwrt-airoha-an7581-fiberhome_hg5585f-ct-squashfs-sysupgrade.itb"

          cp "$IMAGE" artifact/

          cd artifact

          sha256sum *.itb > SHA256SUMS

          echo
          echo "Final artifact:"
          ls -lh

          echo
          echo "SHA256SUMS:"
          cat SHA256SUMS

      - name: Upload HG5585F CT sysupgrade firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-hg5585f-ct-sysupgrade
          path: artifact/**
          if-no-files-found: error
          retention-days: 30
